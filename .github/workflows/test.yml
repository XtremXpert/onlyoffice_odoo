name: test

on:
  workflow_dispatch:
  push:
    branches: ["20.0"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    container: ghcr.io/oca/oca-ci/py3.12-odoo20.0:latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      # onlyoffice_odoo_documents depends on the Enterprise "documents" app: a stub lets the
      # dependency tree resolve, and neither is installed.
      EXCLUDE: "documents,onlyoffice_odoo_documents"
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create stubs for unavailable addons
        run: |
          mkdir -p documents
          printf "{'name': 'Documents', 'version': '20.0.1.0.0', 'depends': ['base'], 'author': 'stub', 'license': 'LGPL-3'}\n" > documents/__manifest__.py
          touch documents/__init__.py
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
